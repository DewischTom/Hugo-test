services:
  hugo:
    image: hugomods/hugo:0.160.0
    command: hugo server --bind 0.0.0.0 --baseURL http://localhost:1313/ -D
    ports:
      - "127.0.0.1:1313:1313"
    volumes:
      - ./website:/src

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_NAME: hugodb
      DB_USER: hugouser
      DB_PASSWORD: hugo_local_123
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_456
      MYSQL_DATABASE: hugodb
      MYSQL_USER: hugouser
      MYSQL_PASSWORD: hugo_local_123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    
volumes:
  mysql_data: